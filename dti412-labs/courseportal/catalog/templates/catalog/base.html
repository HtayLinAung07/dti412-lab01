<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}IT Course Portal{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'catalog:home' %}">DTI CoursePortal</a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="{% url 'catalog:home' %}">Home</a>
            <a class="nav-link" href="{% url 'catalog:course_list' %}">Courses</a>
            <a class="nav-link" href="{% url 'catalog:inquiry' %}">Submit Inquiry</a>
        </div>
    </div>
</nav>

<main class="container my-4 flex-grow-1">
    {% block content %}
    {% endblock %}
</main>

<footer class="bg-dark text-white text-center py-3 mt-auto">
    <small>© 2026 Department of Information Technology. DTI412 Web Development.</small>
</footer>

</body>
</html>
